[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "browser-use-vision"
version = "0.4.0"
description = "Visual Grounding enhancement for browser-use Agent framework"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "MinghongSun" },
]
keywords = ["browser-use", "visual-grounding", "agent", "ui-understanding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "browser-use>=0.12.0",
    "pydantic>=2.0",
    "Pillow>=10.0",
    "httpx>=0.24",
]

[project.optional-dependencies]
florence = [
    "torch>=2.0",
    "torchvision",
    "transformers>=4.40",
    "accelerate",
]
omniparser = [
    "torch>=2.0",
    "ultralytics>=8.0",
    "transformers>=4.40",
]
server = [
    "fastapi>=0.100",
    "uvicorn[standard]",
]
demo = [
    "gradio>=4.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.5",
]
all = [
    "browser-use-vision[florence,omniparser,server,demo,dev]",
]

[project.scripts]
vision-server = "browser_use_vision.server:main"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
