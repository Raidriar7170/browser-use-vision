<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; padding: 30px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header h1 { font-size: 22px; }
        .header-actions { display: flex; gap: 8px; }
        .icon-btn { width: 36px; height: 36px; border: 1px solid #334155; background: #1e293b; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .icon-btn svg { width: 18px; height: 18px; fill: #94a3b8; }
        .icon-btn:hover { background: #334155; }
        .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .card { background: #1e293b; border-radius: 12px; padding: 20px; }
        .card-label { font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; }
        .card-value { font-size: 28px; font-weight: 700; margin: 8px 0; }
        .card-change { font-size: 13px; }
        .card-change.up { color: #22c55e; }
        .card-change.down { color: #ef4444; }
        .chart-area { background: #1e293b; border-radius: 12px; padding: 20px; }
        .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .chart-title { font-size: 16px; font-weight: 600; }
        .chart-tabs { display: flex; gap: 4px; }
        .chart-tab { padding: 6px 14px; border-radius: 6px; border: none; background: transparent; color: #94a3b8; cursor: pointer; font-size: 13px; }
        .chart-tab.active { background: #334155; color: #fff; }
        .chart-placeholder { height: 200px; background: linear-gradient(135deg, #1e3a5f 0%, #0f172a 100%); border-radius: 8px; display: flex; align-items: end; padding: 20px; gap: 8px; }
        .bar { width: 30px; background: #3b82f6; border-radius: 4px 4px 0 0; transition: height 0.3s; }
        .table-area { background: #1e293b; border-radius: 12px; padding: 20px; margin-top: 20px; }
        .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .filter-btn { padding: 6px 14px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #94a3b8; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 5px; }
        .filter-btn svg { width: 14px; height: 14px; fill: #94a3b8; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; font-size: 12px; color: #64748b; text-transform: uppercase; padding: 10px 0; border-bottom: 1px solid #334155; }
        td { padding: 12px 0; border-bottom: 1px solid #1e293b; font-size: 14px; }
        .status { padding: 4px 10px; border-radius: 20px; font-size: 12px; }
        .status.active { background: #14532d; color: #22c55e; }
        .status.pending { background: #422006; color: #f59e0b; }
        #status-msg { margin-top: 15px; color: #22c55e; font-size: 14px; min-height: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Analytics Dashboard</h1>
        <div class="header-actions">
            <button class="icon-btn" data-action="refresh" onclick="doAction('refresh')">
                <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            </button>
            <button class="icon-btn" data-action="settings" onclick="doAction('settings')">
                <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94L14.4 2.81a.49.49 0 00-.48-.41h-3.84a.49.49 0 00-.48.41l-.38 2.65c-.59.24-1.13.56-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87a.49.49 0 00.12.61l2.03 1.58c-.04.31-.06.63-.06.94 0 .31.02.63.06.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.49-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1115.6 12 3.6 3.6 0 0112 15.6z"/></svg>
            </button>
            <button class="icon-btn" data-action="notifications" onclick="doAction('notifications')">
                <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4a2 2 0 002 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
            </button>
            <button class="icon-btn" data-action="download" onclick="doAction('download')">
                <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            </button>
        </div>
    </div>
    <div class="cards">
        <div class="card">
            <div class="card-label">Total Revenue</div>
            <div class="card-value">$45,231</div>
            <div class="card-change up">↑ 20.1% from last month</div>
        </div>
        <div class="card">
            <div class="card-label">Active Users</div>
            <div class="card-value">2,350</div>
            <div class="card-change up">↑ 12.5% from last month</div>
        </div>
        <div class="card">
            <div class="card-label">Bounce Rate</div>
            <div class="card-value">24.5%</div>
            <div class="card-change down">↓ 3.2% from last month</div>
        </div>
    </div>
    <div class="chart-area">
        <div class="chart-header">
            <div class="chart-title">Revenue Overview</div>
            <div class="chart-tabs">
                <button class="chart-tab active" onclick="switchTab(this)">Weekly</button>
                <button class="chart-tab" onclick="switchTab(this)">Monthly</button>
                <button class="chart-tab" onclick="switchTab(this)">Yearly</button>
            </div>
        </div>
        <div class="chart-placeholder">
            <div class="bar" style="height:60px"></div><div class="bar" style="height:90px"></div>
            <div class="bar" style="height:75px"></div><div class="bar" style="height:120px"></div>
            <div class="bar" style="height:100px"></div><div class="bar" style="height:85px"></div>
            <div class="bar" style="height:140px"></div><div class="bar" style="height:110px"></div>
            <div class="bar" style="height:95px"></div><div class="bar" style="height:130px"></div>
            <div class="bar" style="height:105px"></div><div class="bar" style="height:150px"></div>
        </div>
    </div>
    <div class="table-area">
        <div class="table-header">
            <div class="chart-title">Recent Orders</div>
            <button class="filter-btn" onclick="doAction('filter')">
                <svg viewBox="0 0 24 24"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg>
                Filter
            </button>
        </div>
        <table>
            <tr><th>Order ID</th><th>Customer</th><th>Amount</th><th>Status</th></tr>
            <tr><td>#1234</td><td>Alice Chen</td><td>$156.00</td><td><span class="status active">Active</span></td></tr>
            <tr><td>#1235</td><td>Bob Wang</td><td>$89.50</td><td><span class="status pending">Pending</span></td></tr>
            <tr><td>#1236</td><td>Carol Liu</td><td>$245.00</td><td><span class="status active">Active</span></td></tr>
        </table>
    </div>
    <div id="status-msg"></div>
    <script>
        function doAction(action) { document.getElementById('status-msg').textContent = 'Action: ' + action; }
        function switchTab(btn) {
            document.querySelectorAll('.chart-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('status-msg').textContent = 'Switched to: ' + btn.textContent;
        }
    </script>
</body>
</html>
